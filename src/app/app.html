<header>
  <h1>🔴 Pokémon Johto, Kanto & Hoenn Portal</h1>
  <nav>
    <a routerLink="/kanto">🔴 Kanto</a>
    <a routerLink="/johto">🌙 Johto</a>
    <a routerLink="/hoenn">🌿 Hoenn</a>
    <a routerLink="/pokemart">🏬 PokéMart</a>
  </nav>
</header>

@if (pokemonService.selectedPokemon(); as selected) {
  <div class="toast-banner">
    <img [src]="selected.imageUrl" [alt]="selected.name" class="toast-img" />
    <div>
      <strong>Selected Pokémon:</strong> {{ selected.name }} ({{ selected.region }} Region) - Held Item: {{ selected.heldItem }}
    </div>
  </div>
}

<main>
  <router-outlet></router-outlet>
</main>
