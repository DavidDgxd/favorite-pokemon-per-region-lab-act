<div class="pokemon-container">
  <h2>🗺️ {{ region() }} Region Pokémon</h2>

  <div class="card-grid">
    @for (pokemon of pokemonList(); track pokemon.id) {
      <div class="card" (click)="onSelectPokemon(pokemon)">
        <img [src]="pokemon.imageUrl" [alt]="pokemon.name" class="pokemon-img" />
        <h3>{{ pokemon.name }}</h3>
        <p><strong>Type:</strong> {{ pokemon.type }}</p>
        <p><strong>Held Item:</strong> 🎒 {{ pokemon.heldItem }}</p>
        <p class="desc">{{ pokemon.description }}</p>
        <button class="inspect-btn">🔍 Inspect Pokémon</button>
      </div>
    }
  </div>
</div>
